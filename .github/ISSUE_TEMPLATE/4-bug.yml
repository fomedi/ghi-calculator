name: Something isn't working
description: Report a problem with the calculator page.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you entered, what you expected and what you saw.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone, Chrome on Windows
